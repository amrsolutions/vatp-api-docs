openapi: 3.0.3
info:
  title: VatPortal API
  description: |
    VatPortal API allows you to integrate with Azerbaijan's e-taxes.gov.az system for managing invoices (qaimes).

    ## Features
    - Import and upload invoices to e-taxes.gov.az
    - Download invoices from e-taxes.gov.az
    - Delete invoices from portal and e-taxes
    - Monitor asynchronous process status
    - Support for both enterprise and partner integrations

    ## Base URL
    Your base URL is: `https://{subdomain}.vatportal.az/api`

    Replace `{subdomain}` with:
    - **Enterprise customers**: Your company subdomain
    - **Partners**: Your partner account subdomain

    ## Authentication
    Two methods supported:
    1. **Username/Password**: Include in request body
    2. **API Token**: Use `x-vatpapikey` header (recommended)

    ## Partner vs Enterprise
    - **Enterprise**: Single company integration (no `phone` parameter needed)
    - **Partner**: Multi-customer integration (`phone` parameter required in all requests)

    See the Partner Integration Guide in the documentation for details.

  version: 1.0.0
  contact:
    name: VatPortal Support
    url: https://vatportal.az
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://{subdomain}.vatportal.az/api
    description: Production server
    variables:
      subdomain:
        default: demo
        description: |
          Your company or partner subdomain.
          - Enterprise customers: Use your company subdomain (e.g., 'mycompany')
          - Partners: Use your partner account subdomain (e.g., 'partnername')

tags:
  - name: Invoices
    description: Import, upload, and read invoice operations
  - name: E-taxes
    description: Download and delete invoices from e-taxes.gov.az
  - name: Process Monitoring
    description: Monitor asynchronous process status

security:
  - ApiKeyAuth: []
  - UsernamePassword: []

paths:
  /inv/import_upload_invoices.php:
    post:
      tags:
        - Invoices
      summary: Import and upload invoices
      description: |
        Import invoices to VatPortal and optionally upload them to e-taxes.gov.az for signing.

        **Process Flow:**
        1. Import - Invoice saved to portal
        2. Packet Creation - Invoice packaged for e-taxes
        3. Login - Authenticate with e-taxes (PIN1 required if upload=true)
        4. Upload - Send packet to e-taxes
        5. Signing - Electronic signature (PIN2 required)
        6. Complete - Qaime number assigned

        **Recommended Polling:** Use progressive intervals (2s → 5s → 10s) for 3-5 minute operations.

        See the Polling Best Practices guide in the documentation for implementation details.
      operationId: importUploadInvoices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Portal username (not required if using x-vatpapikey header)
                  example: myusername
                password:
                  type: string
                  description: Portal password (not required if using x-vatpapikey header)
                  example: mypassword
                phone:
                  type: string
                  description: |
                    **[Partners only]** ASAN phone number in format 994XXXXXXXXX.
                    Identifies which customer you're operating on behalf of.
                  example: "994501234567"
                  pattern: '^994[0-9]{9}$'
                upload:
                  type: boolean
                  description: Whether to upload invoices to e-taxes.gov.az
                  default: false
                use_old_sys:
                  type: boolean
                  description: Use old (green) e-taxes system
                  default: false
                invoices:
                  type: array
                  description: Array of invoice objects to import/upload
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/Invoice'
